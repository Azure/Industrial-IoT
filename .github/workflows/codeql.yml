name: "CodeQL"

on:
  push:
    branches: [ "latest", "main", "preview", "release/*" ]
  pull_request:
    branches: [ "latest", "main", "preview", "release/*" ]
  schedule:
    - cron: '37 9 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: csharp
          build-mode: autobuild
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Cleanup Nuget.Config
      run: |
        find . -name "Nuget.Config" -type f -delete
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
      # queries: security-extended,security-and-quality
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
      with:
        category: "/language:${{matrix.language}}"
