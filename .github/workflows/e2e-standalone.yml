name: E2E Standalone

# ----------------------------------------------------------------------------
# End-to-end standalone test pipeline. Mirrors the internal Azure DevOps
# pipeline Industrial-IoT-E2E-Standalone.yml using the same PowerShell
# scripts under tools/e2etesting/, but invoked through GitHub Actions with
# federated OIDC auth to Azure (no client secret).
#
# Triggers:
#   - workflow_call  : invoked from ci.yml after images_push so the exact
#                      tag/sha is passed explicitly. Safer than workflow_run.
#   - workflow_dispatch : operator override (mirrors the internal pipeline
#                      parameters: version, region, RG name, cleanup).
#   - schedule       : nightly run against the latest pushed `main` image.
#
# Required repository variables (OIDC federated credential on Entra ID App):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Optional secrets (only when GHCR packages are private and IoT Edge needs
# to pull at runtime):
#   GHCR_USERNAME, GHCR_TOKEN
# ----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. 2.9.17 or latest)'
        required: true
        type: string
      image_registry:
        description: 'Container registry server (default ghcr.io)'
        required: false
        type: string
        default: ghcr.io
      image_namespace:
        description: 'Image namespace inside the registry (default azure)'
        required: false
        type: string
        default: azure
      region:
        description: 'Base region for IoT Hub, OPC PLC ACIs, Key Vault and Storage (northeurope); the IoT Edge VM deploys in swedencentral (EDGE_VM_REGION) because IoT Hub is not offered in swedencentral for this subscription'
        required: false
        type: string
        default: northeurope
      resource_group_name:
        description: 'Resource group (use <generated> for an auto-named per-run RG)'
        required: false
        type: string
        default: '<generated>'
      cleanup:
        description: 'Delete the resource group after the run'
        required: false
        type: boolean
        default: true
      head_sha:
        description: 'Source SHA being validated (informational only)'
        required: false
        type: string
        default: ''
      soak_minutes:
        description: 'Observation window of the long running telemetry quality tests, in minutes'
        required: false
        type: string
        default: '30'
      soak_nodes:
        description: 'Number of 2 second counter nodes for the telemetry quality soak'
        required: false
        type: string
        default: '100'
      suite:
        description: 'E2E suite to run: all, basic, counters, heartbeat or ae'
        required: false
        type: string
        default: all
      test_filter:
        description: 'Optional dotnet test filter overriding the suite trait filter'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. 2.9.17 or latest)'
        required: true
        type: string
        default: latest
      image_registry:
        description: 'Container registry server'
        required: false
        type: string
        default: ghcr.io
      image_namespace:
        description: 'Image namespace inside the registry'
        required: false
        type: string
        default: azure
      region:
        description: 'Base region for IoT Hub, OPC PLC ACIs, Key Vault and Storage (northeurope); the IoT Edge VM deploys in swedencentral (EDGE_VM_REGION) because IoT Hub is not offered in swedencentral for this subscription'
        required: false
        type: string
        default: northeurope
      resource_group_name:
        description: 'Resource group (use <generated> for an auto-named per-run RG)'
        required: false
        type: string
        default: '<generated>'
      cleanup:
        description: 'Delete the resource group after the run'
        required: false
        type: boolean
        default: true
      soak_minutes:
        description: 'Observation window of the long running telemetry quality tests, in minutes'
        required: false
        type: string
        default: '30'
      soak_nodes:
        description: 'Number of 2 second counter nodes for the telemetry quality soak'
        required: false
        type: string
        default: '100'
      suite:
        description: 'E2E suite to run'
        required: false
        type: choice
        options:
          - all
          - basic
          - counters
          - heartbeat
          - ae
        default: all
      test_filter:
        description: 'Optional dotnet test filter overriding the suite trait filter'
        required: false
        type: string
        default: ''

permissions:
  id-token: write   # OIDC federation to Azure
  contents: read
  actions: read

concurrency:
  # Serialize per-RG so a new run doesn't kill an in-flight deploy and leak
  # Azure resources. RG name is unique-per-run when the input is <generated>,
  # so concurrent CI runs do not collide.
  group: e2e-${{ inputs.resource_group_name || 'nightly' }}
  cancel-in-progress: false

env:
  # Versions of the image and tools must be consistent across all jobs in this
  # workflow run. workflow_call / workflow_dispatch always provide inputs; the
  # schedule trigger does not, so we fall back to `latest` (the floating tag
  # that ci.yml's images_push refreshes from main).
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
  IMAGE_REGISTRY: ${{ inputs.image_registry || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ inputs.image_namespace || 'azure' }}
  E2E_REGION: ${{ inputs.region || 'northeurope' }}
  # This E2E subscription can only allocate standard VM SKUs in swedencentral,
  # but IoT Hub is not offered there. So every resource deploys in E2E_REGION
  # (northeurope) while the IoT Edge VM alone deploys in EDGE_VM_REGION; the VM
  # reaches IoT Hub and the OPC PLC containers over their public endpoints.
  EDGE_VM_REGION: swedencentral
  EDGE_VERSION: '1.4'
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  # --------------------------------------------------------------------------
  # init: compute the resource group name once so every other job uses the
  # same value. <generated> mirrors the internal pipeline's date+counter
  # pattern: e2etesting<YYYYMMDD><run_number>.
  #
  # It also derives the job timeout of the telemetry quality soaks from the
  # configured observation window. GitHub Actions expressions have no
  # arithmetic operators, so this cannot be done inline in the job's `with:`.
  # --------------------------------------------------------------------------
  init:
    name: Compute run variables
    runs-on: ubuntu-latest
    # This job only computes strings; it never talks to Azure. Drop the
    # workflow-level `id-token: write` so it cannot mint an OIDC assertion for
    # the E2E service principal. That closes the escalation path structurally:
    # even if a future edit reintroduces an unsafe `${{ }}` interpolation into
    # the script below, there is no token for injected code to steal.
    permissions:
      contents: read
    outputs:
      resource_group_name: ${{ steps.compute.outputs.rg }}
      soak_timeout_minutes: ${{ steps.compute.outputs.soak_timeout }}
    steps:
      - id: compute
        shell: bash
        # Workflow inputs are passed through `env:` and dereferenced as shell
        # variables rather than interpolated with `${{ }}` directly into the
        # script. GitHub substitutes `${{ }}` textually before bash parses the
        # line, so an input containing a quote would break out of the string
        # and execute as shell -- in a job that holds `id-token: write` and can
        # therefore mint an Azure OIDC assertion for the E2E service principal.
        env:
          RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name || '<generated>' }}
          SOAK_MINUTES: ${{ inputs.soak_minutes || '30' }}
          SUITE: ${{ inputs.suite || 'all' }}
          TEST_FILTER: ${{ inputs.test_filter || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Use github.run_id (globally unique per workflow run) -- not
          # github.run_number which is per-workflow and could collide with
          # other workflows generating RGs the same day.
          if [ "$RESOURCE_GROUP_NAME" = "<generated>" ]; then
            rg="e2etesting$(date -u +%Y%m%d)${RUN_ID}"
          else
            rg="$RESOURCE_GROUP_NAME"
          fi
          # Azure resource group names allow letters, digits, '_', '-', '.' and
          # parentheses. Reject anything else rather than passing it on to the
          # deployment scripts.
          if ! [[ "$rg" =~ ^[A-Za-z0-9._()-]{1,90}$ ]]; then
            echo "::error::Invalid resource group name: $rg"
            exit 1
          fi
          echo "rg=${rg}" >> "$GITHUB_OUTPUT"
          echo "Resource group: ${rg}"

          # Observation window plus headroom for restoring and building the
          # test solution, deploying the publisher module, creating the
          # simulation container, warming up and tearing everything down.
          if ! [[ "$SOAK_MINUTES" =~ ^[0-9]{1,4}$ ]]; then
            echo "::error::soak_minutes must be a number, got: $SOAK_MINUTES"
            exit 1
          fi
          echo "soak_timeout=$((SOAK_MINUTES + 60))" >> "$GITHUB_OUTPUT"
          echo "Soak job timeout: $((SOAK_MINUTES + 60)) minutes"

          case "$SUITE" in
            all|basic|counters|heartbeat|ae) ;;
            *)
              echo "::error::suite must be one of all, basic, counters, heartbeat or ae; got: $SUITE"
              exit 1
              ;;
          esac
          if [ -n "$TEST_FILTER" ] && [ "$SUITE" = "all" ]; then
            echo "::error::test_filter requires a single selected suite; suite=all would apply the same filter to every job."
            exit 1
          fi
          echo "E2E suite: $SUITE"

  # --------------------------------------------------------------------------
  # validate_tests: compile the E2E solution before provisioning an IoT Hub,
  # VM, Key Vault and PLC containers. The E2E solution is intentionally not a
  # member of Industrial-IoT.slnx, so the normal CI build cannot catch drift in
  # it. A missing reference previously consumed an entire Azure deployment
  # before all four test jobs failed at compile time.
  # --------------------------------------------------------------------------
  validate_tests:
    name: Validate E2E test solution
    needs: init
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore E2E test solution
        shell: bash
        run: |
          dotnet restore e2e-tests/IIoTPlatform-E2E-Tests.slnx \
            -s https://api.nuget.org/v3/index.json
      - name: Build E2E test solution
        shell: bash
        run: |
          dotnet build e2e-tests/IIoTPlatform-E2E-Tests.slnx \
            -c Release --no-restore --no-incremental
      - name: Run E2E reader unit tests
        shell: bash
        run: |
          mkdir -p e2e-tests/results
          dotnet test \
            e2e-tests/OpcPublisher-E2E-Tests/OpcPublisher-AE-E2E-Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~PubSubMessageMatcherTests" \
            --results-directory e2e-tests/results \
            --logger "trx;LogFileName=pubsub-message-matcher.trx"
          if ! grep -Eq 'total="[1-9][0-9]*"' \
              e2e-tests/results/pubsub-message-matcher.trx; then
            echo "::error::E2E reader unit tests matched zero tests."
            exit 1
          fi

  # --------------------------------------------------------------------------
  # deploy_standalone: deploys the standalone IIoT infrastructure (KeyVault,
  # IoT Hub, ResourceGroup tags) and writes the GHCR registry secrets into
  # KeyVault so the test runs and the IoT Edge module config can pull the
  # right image.
  # --------------------------------------------------------------------------
  deploy_standalone:
    name: Deploy standalone resources
    needs: [init, validate_tests]
    runs-on: windows-latest
    # Gate every job that authenticates to Azure behind the `e2e` environment,
    # matching e2e-gc.yml. The environment is where the deployment credentials
    # and any required-reviewer rules live, so a workflow_dispatch alone is not
    # sufficient to reach the subscription.
    environment: e2e
    timeout-minutes: 60
    outputs:
      key_vault_name: ${{ steps.kv.outputs.KeyVaultName }}
      resource_group_name: ${{ needs.init.outputs.resource_group_name }}
    env:
      ResourceGroupName: ${{ needs.init.outputs.resource_group_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC, with PowerShell session)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Deploy standalone resources
        shell: pwsh
        run: |
          ./tools/e2etesting/DeployStandalone.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}" `
            -Region "${{ env.E2E_REGION }}" `
            -ServicePrincipalId "${{ vars.AZURE_CLIENT_ID }}"
      - name: Determine KeyVault name
        id: kv
        shell: pwsh
        # DetermineKeyVaultName.ps1 calls Set-CIVariable, which writes
        # KeyVaultName=<value> to $GITHUB_OUTPUT (and $GITHUB_ENV) thanks to
        # the additive enhancement in tools/e2etesting/_ci.ps1.
        run: |
          ./tools/e2etesting/DetermineKeyVaultName.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}"
      - name: Write registry credentials to KeyVault
        shell: pwsh
        # ImageNamespace is required by SetKeyVaultSecrets.ps1; we pass the
        # GHCR namespace ("azure" by default). Username/password default to
        # empty when packages are public; provide them via repo secrets only
        # if you switched the GHCR packages to private visibility.
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ./tools/e2etesting/SetKeyVaultSecrets.ps1 `
            -KeyVaultName "${{ env.KeyVaultName }}" `
            -ImageTag "${{ env.IMAGE_TAG }}" `
            -ImageNamespace "${{ env.IMAGE_NAMESPACE }}" `
            -ContainerRegistryServer "${{ env.IMAGE_REGISTRY }}" `
            -ContainerRegistryUsername "$env:GHCR_USERNAME" `
            -ContainerRegistryPassword "$env:GHCR_TOKEN"

  # --------------------------------------------------------------------------
  # deploy_test_resources: deploys IoT Hub event hub config, OPC PLC ACI
  # containers, and the IoT Edge VM, then writes connection variables into
  # KeyVault for the test run jobs to consume.
  # --------------------------------------------------------------------------
  deploy_test_resources:
    name: Deploy test resources (PLCs + IoT Edge VM)
    needs: [init, deploy_standalone]
    runs-on: windows-latest
    environment: e2e
    timeout-minutes: 90
    outputs:
      fqdn: ${{ steps.deploy_edge.outputs.Fqdn }}
      edge_identity: ${{ steps.deploy_edge.outputs.EdgeIdentity }}
      edge_vm_username: ${{ steps.deploy_edge.outputs.EdgeVmUsername }}
      plc_urls: ${{ steps.deploy_plcs.outputs.OpcPlcSimulationUrls }}
      plc_ips: ${{ steps.deploy_plcs.outputs.OpcPlcSimulationIps }}
    env:
      ResourceGroupName: ${{ needs.init.outputs.resource_group_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Deploy IoT Hub event hub + storage
        shell: pwsh
        run: |
          ./tools/e2etesting/DeployTestResources.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}"
      - name: Deploy OPC PLC simulators
        id: deploy_plcs
        shell: pwsh
        run: |
          ./tools/e2etesting/DeployPLCs.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}" `
            -UsePrivateIp $false
      - name: Deploy IoT Edge VM
        id: deploy_edge
        shell: pwsh
        # Note: SshPrivateKey is written with -Secret in DeployEdge.ps1 so it
        # is masked from job logs and the output is treated as a secret.
        env:
          KEYS_PATH: ${{ runner.temp }}/keys
        run: |
          ./tools/e2etesting/DeployEdge.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}" `
            -EdgeVmLocation "${{ env.EDGE_VM_REGION }}" `
            -KeysPath "$env:KEYS_PATH"
      - name: Refresh Azure login
        # The IoT Edge VM deploy can run longer than the GitHub OIDC assertion's
        # ~5 minute lifetime, after which az CLI calls against a new scope (Key
        # Vault) fail with AADSTS700024 ("Client assertion is not within its
        # valid time range"). Re-login to obtain a fresh federated token before
        # the Key Vault writes below.
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Write test variables to KeyVault
        shell: pwsh
        # We re-determine KeyVaultName in this job because $GITHUB_ENV does
        # not flow across jobs; using the deploy_standalone output would
        # require plumbing an extra needs link. Both runs return the same KV.
        run: |
          ./tools/e2etesting/SetTestVariables.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}" `
            -OpcPlcSimulationUrls "${{ env.OpcPlcSimulationUrls }}" `
            -OpcPlcSimulationIps "${{ env.OpcPlcSimulationIps }}" `
            -Fqdn "${{ env.Fqdn }}" `
            -EdgeIdentity "${{ env.EdgeIdentity }}" `
            -EdgeVmUsername "${{ env.EdgeVmUsername }}" `
            -SshPrivateKey "${{ env.SshPrivateKey }}" `
            -SshPublicKey "${{ env.SshPublicKey }}"

  # --------------------------------------------------------------------------
  # The test suites share one two-vCPU IoT Edge VM. Separate publisher modules
  # and consumer groups isolate names and telemetry, but they do not create more
  # CPU, memory or one more edgeHub. Running A&E and both soaks concurrently
  # kept the gateway busy for ninety minutes and the heartbeat module then went
  # offline. Serialize basic -> counters -> heartbeat -> A&E. Every job uses
  # always() plus the deployment result so a failed suite does not hide the
  # later ones, while !cancelled() stops new suites after an operator cancel.
  # Targeted dispatch can still skip directly to any one suite.
  # --------------------------------------------------------------------------
  run_tests_basic:
    name: Run basic tests (PublisherMode=standalone)
    needs: [init, deploy_standalone, deploy_test_resources]
    if: |
      always() &&
      !cancelled() &&
      needs.deploy_test_resources.result == 'success' &&
      (inputs.suite == null || inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'basic')
    uses: ./.github/workflows/e2e-run-tests.yml
    with:
      resource_group_name: ${{ needs.init.outputs.resource_group_name }}
      key_vault_name: ${{ needs.deploy_standalone.outputs.key_vault_name }}
      filter_name: PublisherMode
      filter_value: standalone
      timeout_minutes: 240
      result_label: basic
      image_registry: ${{ inputs.image_registry || 'ghcr.io' }}
      image_namespace: ${{ inputs.image_namespace || 'azure' }}
      image_tag: ${{ inputs.image_tag || 'latest' }}
      edge_version: '1.4'
      test_filter: ${{ inputs.test_filter || '' }}
    secrets: inherit

  # --------------------------------------------------------------------------
  # The counter soak reproduces the customer configuration (2 s publishing,
  # sampling and heartbeat interval, queue size > 1, PubSub encoding) against
  # nodes that count up every 2 s. A value arrives on every cycle, so the
  # heartbeat watchdog must never fire and the stream must be complete,
  # ordered, free of repeats and evenly spaced.
  # --------------------------------------------------------------------------
  run_tests_soak_counters:
    name: Run telemetry quality soak (counters)
    needs: [init, deploy_standalone, deploy_test_resources, run_tests_basic]
    if: |
      always() &&
      !cancelled() &&
      needs.deploy_test_resources.result == 'success' &&
      (inputs.suite == null || inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'counters')
    uses: ./.github/workflows/e2e-run-tests.yml
    with:
      resource_group_name: ${{ needs.init.outputs.resource_group_name }}
      key_vault_name: ${{ needs.deploy_standalone.outputs.key_vault_name }}
      filter_name: PublisherMode
      filter_value: soakcounters
      timeout_minutes: ${{ fromJSON(needs.init.outputs.soak_timeout_minutes) }}
      result_label: soak-counters
      image_registry: ${{ inputs.image_registry || 'ghcr.io' }}
      image_namespace: ${{ inputs.image_namespace || 'azure' }}
      image_tag: ${{ inputs.image_tag || 'latest' }}
      edge_version: '1.4'
      soak_minutes: ${{ inputs.soak_minutes || '30' }}
      soak_nodes: ${{ inputs.soak_nodes || '100' }}
      test_filter: ${{ inputs.test_filter || '' }}
    secrets: inherit

  # --------------------------------------------------------------------------
  # The complement: nodes that change only every 2 minutes with a 10 s
  # heartbeat, so heartbeats must fire. Asserts that they fire at the right
  # cadence and that they do not produce stale or unevenly spaced values for a
  # consumer that honours the heartbeat indicator.
  # --------------------------------------------------------------------------
  run_tests_soak_heartbeat:
    name: Run telemetry quality soak (heartbeat)
    needs: [init, deploy_standalone, deploy_test_resources, run_tests_basic,
            run_tests_soak_counters]
    if: |
      always() &&
      !cancelled() &&
      needs.deploy_test_resources.result == 'success' &&
      (inputs.suite == null || inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'heartbeat')
    uses: ./.github/workflows/e2e-run-tests.yml
    with:
      resource_group_name: ${{ needs.init.outputs.resource_group_name }}
      key_vault_name: ${{ needs.deploy_standalone.outputs.key_vault_name }}
      filter_name: PublisherMode
      filter_value: soakheartbeat
      timeout_minutes: ${{ fromJSON(needs.init.outputs.soak_timeout_minutes) }}
      result_label: soak-heartbeat
      image_registry: ${{ inputs.image_registry || 'ghcr.io' }}
      image_namespace: ${{ inputs.image_namespace || 'azure' }}
      image_tag: ${{ inputs.image_tag || 'latest' }}
      edge_version: '1.4'
      soak_minutes: ${{ inputs.soak_minutes || '30' }}
      test_filter: ${{ inputs.test_filter || '' }}
    secrets: inherit

  # --------------------------------------------------------------------------
  # A&E is last. It contains 43 event and condition tests and, while its reader
  # was still 2.9-shaped, nine separate tests each consumed their ten-minute
  # budget. Keeping it last means an event regression cannot starve the already
  # independent basic and telemetry-quality coverage.
  # --------------------------------------------------------------------------
  run_tests_ae:
    name: Run A&E tests (PublisherMode=AE)
    needs: [init, deploy_standalone, deploy_test_resources, run_tests_basic,
            run_tests_soak_counters, run_tests_soak_heartbeat]
    if: |
      always() &&
      !cancelled() &&
      needs.deploy_test_resources.result == 'success' &&
      (inputs.suite == null || inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'ae')
    uses: ./.github/workflows/e2e-run-tests.yml
    with:
      resource_group_name: ${{ needs.init.outputs.resource_group_name }}
      key_vault_name: ${{ needs.deploy_standalone.outputs.key_vault_name }}
      filter_name: PublisherMode
      filter_value: AE
      timeout_minutes: 180
      result_label: ae
      image_registry: ${{ inputs.image_registry || 'ghcr.io' }}
      image_namespace: ${{ inputs.image_namespace || 'azure' }}
      image_tag: ${{ inputs.image_tag || 'latest' }}
      edge_version: '1.4'
      test_filter: ${{ inputs.test_filter || '' }}
    secrets: inherit

  # --------------------------------------------------------------------------
  # cleanup: always-on resource group teardown. Skip when the operator opts
  # out via the cleanup=false input (for triage of a failed run).
  # --------------------------------------------------------------------------
  cleanup:
    name: Delete resource group
    needs: [init, deploy_standalone, deploy_test_resources, run_tests_ae, run_tests_basic,
            run_tests_soak_counters, run_tests_soak_heartbeat]
    if: always() && (inputs.cleanup == null || inputs.cleanup == true)
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 30
    env:
      ResourceGroupName: ${{ needs.init.outputs.resource_group_name }}
    steps:
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Remove resource group
        shell: bash
        # Use `az group delete --no-wait` so the deletion runs server-side
        # and isn't tied to the runner. The PowerShell `-AsJob` background
        # job would die with the runner before deletion completes.
        env:
          RG: ${{ env.ResourceGroupName }}
        run: |
          if az group show --name "$RG" >/dev/null 2>&1; then
            echo "Submitting async delete for resource group '$RG'..."
            az group delete --name "$RG" --yes --no-wait
          else
            echo "Resource group '$RG' not found; nothing to clean up."
          fi
