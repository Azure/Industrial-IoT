name: E2E Run Tests

# ----------------------------------------------------------------------------
# Reusable helper workflow that runs the IIoTPlatform-E2E-Tests xUnit suite
# against a previously-deployed standalone resource group. Invoked twice by
# e2e-standalone.yml -- once with PublisherMode=AE, once with
# PublisherMode=standalone -- to keep the test logic in one place.
#
# Required repository variables (federated OIDC):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# ----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      resource_group_name:
        required: true
        type: string
      key_vault_name:
        required: true
        type: string
      filter_name:
        description: 'xUnit trait name (e.g. PublisherMode)'
        required: true
        type: string
      filter_value:
        description: 'xUnit trait value (e.g. AE or standalone)'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout, in minutes'
        required: false
        type: number
        default: 90
      result_label:
        description: 'Short label appended to artifact name'
        required: true
        type: string
      image_registry:
        required: false
        type: string
        default: ghcr.io
      image_namespace:
        required: false
        type: string
        default: azure
      image_tag:
        required: true
        type: string
      edge_version:
        required: false
        type: string
        default: '1.4'
      soak_minutes:
        description: 'Observation window for the long running telemetry quality tests, in minutes'
        required: false
        type: string
        default: ''
      soak_nodes:
        description: 'Number of counter nodes for the long running telemetry quality tests'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  run:
    name: ${{ inputs.filter_name }}=${{ inputs.filter_value }}
    runs-on: windows-latest
    # This job authenticates to Azure and reads Key Vault secrets, so it is
    # gated behind the `e2e` environment like every other Azure-touching job.
    # `environment` cannot be set on the calling `uses:` job, so it has to be
    # declared here in the reusable workflow.
    environment: e2e
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      ResourceGroupName: ${{ inputs.resource_group_name }}
      KeyVaultName: ${{ inputs.key_vault_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so Nerdbank.GitVersioning can compute the
          # version height when the E2E test solution builds; a shallow clone
          # fails with "Shallow clone lacks the objects required...".
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # ----------------------------------------------------------------------
      # azure/login intermittently fails its Azure PowerShell leg with "the
      # provided account does not have access to subscription <id>" even
      # though the Azure CLI leg succeeded seconds earlier using the very same
      # federated token and the very same subscription. Observed in run
      # 31586188505, where the CLI logged "Azure CLI login succeeds by using
      # OIDC" and the PowerShell login then failed against the subscription it
      # had just selected.
      #
      # The test job that follows runs for tens of minutes and up to four
      # hours, and it has already paid for a full infrastructure deployment
      # that is torn down with the run, so a transient login must not be
      # allowed to discard it. Attempt the login twice before giving up. The
      # second attempt is not tolerant, so a genuine credential or permission
      # problem still fails the job.
      # ----------------------------------------------------------------------
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        id: azure_login
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Azure login (retry after transient failure)
        if: steps.azure_login.outcome == 'failure'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Grant KeyVault access to the federated SP
        shell: pwsh
        # Mirrors templates/steps/runtests.yml; the script iterates KVs in
        # the RG and sets get/list/set on secrets. We pass the App
        # Registration client id as the service principal name -- which
        # Set-AzKeyVaultAccessPolicy accepts as an alias for the app id.
        run: |
          ./tools/e2etesting/SetKeyVaultPermissions.ps1 `
            -ResourceGroupName "${{ env.ResourceGroupName }}" `
            -ServicePrincipalName "${{ vars.AZURE_CLIENT_ID }}"
      - name: Fetch KeyVault secrets and mask them in logs
        shell: bash
        # Replicates the AzureKeyVault@2 task: each secret is exposed to the
        # test step via $GITHUB_ENV and masked from logs via ::add-mask::.
        # Names mirror the AzureKeyVault@2 SecretsFilter from runtests.yml.
        run: |
          set -euo pipefail
          fetch() {
            local name="$1"
            local env_name="$2"
            local val
            val=$(az keyvault secret show --vault-name "$KeyVaultName" --name "$name" --query value -o tsv 2>/dev/null || true)
            # The az CLI on Windows runners emits values with CRLF line
            # endings; command substitution strips the trailing LF but leaves
            # a CR, which corrupts single-line secrets such as the IoT Hub
            # connection string (its base64 SharedAccessKey then fails to
            # parse). Strip all CRs so values are used verbatim.
            val="${val//$'\r'/}"
            if [ -z "$val" ]; then
              echo "::warning::KeyVault secret '$name' is missing or empty"
              return
            fi
            echo "::add-mask::$val"
            # Use the heredoc form to be safe with newlines (SSH keys). The
            # delimiter is generated with bash's built-in $RANDOM rather than
            # uuidgen, which is not available in Git Bash on Windows runners.
            delim="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
            {
              echo "${env_name}<<${delim}"
              echo "${val}"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          }
          fetch 'PCS-IOTHUB-CONNSTRING'            'PCS_IOTHUB_CONNSTRING'
          fetch 'plc-simulation-urls'              'PLC_SIMULATION_URLS'
          fetch 'plc-simulation-ips'               'PLC_SIMULATION_IPS'
          fetch 'iot-edge-vm-username'             'IOT_EDGE_VM_USERNAME'
          fetch 'iot-edge-vm-publickey'            'IOT_EDGE_VM_PUBLICKEY'
          fetch 'iot-edge-vm-privatekey'           'IOT_EDGE_VM_PRIVATEKEY'
          fetch 'iot-edge-device-id'               'IOT_EDGE_DEVICE_ID'
          fetch 'iot-edge-device-dnsname'          'IOT_EDGE_DEVICE_DNSNAME'
          fetch 'iothub-eventhub-connectionstring' 'IOTHUB_EVENTHUB_CONNECTIONSTRING'
          fetch 'PCS-SUBSCRIPTION-ID'              'PCS_SUBSCRIPTION_ID'
      - name: Restore E2E test solution
        shell: bash
        # Pin to nuget.org -- repo's Nuget.Config points to an internal feed
        # the runner cannot read.
        run: |
          dotnet restore e2e-tests/IIoTPlatform-E2E-Tests.slnx \
            -s https://api.nuget.org/v3/index.json
      - name: Build E2E test solution
        shell: bash
        run: |
          dotnet build e2e-tests/IIoTPlatform-E2E-Tests.slnx \
            -c Release --no-restore --no-incremental
      - name: Discover xUnit tests (${{ inputs.filter_name }}=${{ inputs.filter_value }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e-tests/results
          dotnet test e2e-tests/IIoTPlatform-E2E-Tests.slnx \
            --configuration Release --no-build --list-tests \
            --filter "${{ inputs.filter_name }}=${{ inputs.filter_value }}" \
            --logger "console;verbosity=normal" \
            | tee "e2e-tests/results/${{ inputs.result_label }}-discovery.txt"
          discovered=$(awk '
            /The following Tests are available:/ { listed = 1; next }
            listed && /^[[:space:]]*$/ { exit }
            listed && /^[[:space:]]+[^[:space:]]/ { count++ }
            END { print count + 0 }
          ' "e2e-tests/results/${{ inputs.result_label }}-discovery.txt")
          echo "Discovered ${discovered} test(s) for ${{ inputs.filter_name }}=${{ inputs.filter_value }}."
          if [ "${discovered}" -eq 0 ]; then
            echo "::error::The requested E2E mode discovered zero tests."
            exit 1
          fi
      - name: Execute xUnit tests (${{ inputs.filter_name }}=${{ inputs.filter_value }})
        id: test
        shell: bash
        env:
          # Mirrors templates/steps/runtests.yml env block. PCS_DOCKER_*,
          # PCS_IMAGES_* override what's in KV so the test deployment uses
          # the GHCR image just pushed by ci.yml.
          PCS_DOCKER_SERVER: ${{ inputs.image_registry }}
          PCS_DOCKER_USER: ${{ secrets.GHCR_USERNAME }}
          PCS_DOCKER_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          PCS_IMAGES_NAMESPACE: ${{ inputs.image_namespace }}
          PCS_IMAGES_TAG: ${{ inputs.image_tag }}
          PCS_RESOURCE_GROUP: ${{ env.ResourceGroupName }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          IOT_EDGE_VERSION: ${{ inputs.edge_version }}
          # Only consumed by the long running telemetry quality tests; empty
          # values leave the in-code defaults (30 minutes, 100 nodes) in place.
          IIOT_E2E_SOAK_MINUTES: ${{ inputs.soak_minutes }}
          IIOT_E2E_SOAK_NODES: ${{ inputs.soak_nodes }}
        run: |
          set -euo pipefail
          mkdir -p e2e-tests/results
          #
          # The blame detector measures the time between test completions, so
          # the window has to clear the longest legitimate one. A telemetry
          # quality soak observes the stream for soak_minutes before its single
          # test finishes; a fixed ten minute window killed every soak job on
          # preview and reported it as "Test host process crashed" with no
          # failing test, because the results file holds only the tests that
          # had already passed.
          #
          # It is still worth having. Without it a stuck A&E test occupied the
          # shared IoT Edge gateway for the full job timeout and starved the
          # soak jobs deployed alongside it.
          #
          # For a soak the window is anchored just under the job timeout rather
          # than derived from soak_minutes directly. SoakTestBase bounds itself
          # with Duration + 45 minutes, which at the default is the same 75
          # minutes an earlier soak_minutes + 45 window produced: the two fired
          # together and the detector won, so the test never got to report its
          # own cancellation and the results file came back empty. Sitting five
          # minutes under the job timeout keeps the detector strictly the last
          # resort, after the test's own token has had its chance to fail with
          # a diagnostic.
          #
          # Everything else gets twenty minutes, twice the suite's own
          # per-class budget, so a stuck test there fails quickly instead of
          # holding the gateway.
          #
          if [ -n "${IIOT_E2E_SOAK_MINUTES:-}" ]; then
            hang_minutes=$(( ${{ inputs.timeout_minutes }} - 5 ))
          else
            hang_minutes=20
          fi
          echo "Blame hang window: ${hang_minutes}m"
          dotnet test e2e-tests/IIoTPlatform-E2E-Tests.slnx \
            --configuration Release --no-build \
            --filter "${{ inputs.filter_name }}=${{ inputs.filter_value }}" \
            --blame-hang-timeout "${hang_minutes}m" --blame-hang-dump-type none \
            --logger "trx;LogFileName=${{ inputs.result_label }}.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory e2e-tests/results
      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ inputs.result_label }}
          path: e2e-tests/results
          if-no-files-found: warn
          retention-days: 14
