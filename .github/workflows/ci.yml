name: CI

# ----------------------------------------------------------------------------
# Mirrors the internal Azure DevOps OneBranch pipeline in a GitHub Actions
# native form. Complements (does not replace) the internal pipeline.
#
# Stages (mirrors templates in the internal Industrial-IoT repo):
#   version         -> compute nbgv version, share via job outputs
#   build_test      -> matrix (Linux + Windows) x (Fast and ServerIntegration test projects)
#                      with coverlet.msbuild Cobertura coverage
#   coverage_report -> merge with ReportGenerator -> $GITHUB_STEP_SUMMARY
#   images_build    -> matrix arch (x64/arm/arm64), produces image tarballs
#   images_push     -> multi-arch buildx push to ghcr.io/azure/<repo>,
#                      cosign keyless signing of the index digest
#   nuget_pack      -> dotnet pack (3 IsPackable projects only)
#   nuget_publish   -> push to GitHub Packages NuGet feed (main/release/* push)
#   e2e             -> calls reusable e2e-standalone.yml after images_push
#
# Required repository variables for E2E (federated OIDC, no client secret):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main, preview, release/*]
  push:
    branches: [main, preview, release/*]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run the E2E standalone tests after images are pushed'
        type: boolean
        default: true
      e2e_region:
        description: 'Base region for IoT Hub, OPC PLC ACIs, Key Vault and Storage (northeurope); the IoT Edge VM deploys in swedencentral (EDGE_VM_REGION) because IoT Hub is not offered in swedencentral for this subscription'
        type: string
        default: northeurope
      e2e_cleanup:
        description: 'Delete the E2E resource group after the run completes'
        type: boolean
        default: true
  schedule:
    # Nightly build of main at 10:00 UTC (matches the internal Industrial-IoT-E2E-Standalone schedule)
    - cron: '0 10 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel duplicate PR runs but never cancel push/schedule runs (they may be
  # partway through pushing images or running E2E and would leak GHCR or
  # Azure resources).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # version: compute nbgv version once and share across jobs.
  # NBGV_SimpleVersion is the Docker-safe tag (no '+' build metadata).
  # NBGV_NuGetPackageVersion is the full SemVer 2.0 string used for NuGet.
  # --------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      simple_version: ${{ steps.nbgv.outputs.simple_version }}
      nuget_version: ${{ steps.nbgv.outputs.nuget_version }}
      prerelease: ${{ steps.nbgv.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install nbgv
        # The repo Nuget.Config points only at the internal Azure Artifacts
        # feed which the runner cannot read unauthenticated. Install the
        # tool from a directory outside the repo so the repo's nuget.config
        # is ignored.
        working-directory: ${{ runner.temp }}
        run: dotnet tool install --global nbgv --add-source https://api.nuget.org/v3/index.json
        shell: bash
      - name: Compute version
        id: nbgv
        run: |
          set -euo pipefail
          json=$(nbgv get-version -f json)
          simple=$(echo "$json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['CloudBuildAllVars']['NBGV_SimpleVersion'])")
          nuget=$(echo "$json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['CloudBuildAllVars']['NBGV_NuGetPackageVersion'])")
          prerelease=$(echo "$json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['CloudBuildAllVars'].get('NBGV_PrereleaseVersion',''))")
          echo "simple_version=$simple" >> "$GITHUB_OUTPUT"
          echo "nuget_version=$nuget" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "## Version" >> "$GITHUB_STEP_SUMMARY"
          echo "- Simple: \`$simple\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- NuGet:  \`$nuget\`" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  # --------------------------------------------------------------------------
  # build_test: each project is run in its own job. Fast projects remain
  # parallelizable in the matrix; each ServerIntegration project executes in
  # one serial test process so its OPC UA fixture ports and PKI roots are
  # isolated. Coverage is
  # collected with coverlet.msbuild (the only coverlet package referenced
  # by the test csproj files) using MSBuild integration -- same as the
  # internal templates/test.yml.
  # --------------------------------------------------------------------------
  build_test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.project.category }} / ${{ matrix.project.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project:
          - name: Models
            path: src/Azure.IIoT.OpcUa.Publisher.Models/tests/Azure.IIoT.OpcUa.Publisher.Models.Tests.csproj
            category: Fast
          - name: Sdk
            path: src/Azure.IIoT.OpcUa.Publisher.Sdk/tests/Azure.IIoT.OpcUa.Publisher.Sdk.Tests.csproj
            category: Fast
          - name: Core
            path: src/Azure.IIoT.OpcUa.Core/tests/Azure.IIoT.OpcUa.Core.Tests.csproj
            category: Fast
          - name: OpcUa
            path: src/Azure.IIoT.OpcUa/tests/Azure.IIoT.OpcUa.Tests.csproj
            category: Fast
          - name: Testing
            path: src/Azure.IIoT.OpcUa.Publisher.Testing/tests/Azure.IIoT.OpcUa.Publisher.Testing.csproj
            category: ServerIntegration
          - name: Publisher
            path: src/Azure.IIoT.OpcUa.Publisher/tests/Azure.IIoT.OpcUa.Publisher.Tests.csproj
            category: ServerIntegration
          - name: Publisher.Module
            path: src/Azure.IIoT.OpcUa.Publisher.Module/tests/Azure.IIoT.OpcUa.Publisher.Module.Tests.csproj
            category: ServerIntegration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        # Restore against nuget.org explicitly; the repo Nuget.Config points
        # only at the internal Azure Artifacts feed.
        # Use pwsh on both OSes -- on Windows, Git Bash (MSYS) corrupts
        # MSBuild `/p:` args (strips the leading `/` thinking it's a Unix
        # path) and escapes backslashes in Windows paths like `D:\a\...`.
        run: dotnet restore "${{ matrix.project.path }}" -s https://api.nuget.org/v3/index.json
        shell: pwsh
      - name: Build
        run: dotnet build "${{ matrix.project.path }}" -c Release --no-restore --no-incremental
        shell: pwsh
      - name: Test
        # OPC UA tests within a project contend on local ports and PKI
        # directories; --blame-hang-timeout protects against the
        # intermittent test-host hangs that historically affected Windows.
        # Keep the Publisher.Module Linux coverage run at 30 minutes: its
        # coverlet finalizer can be idle for more than 10 minutes after tests
        # complete. Fixture and server bounds remain much shorter.
        #
        # Coverage uses the `XPlat Code Coverage` data collector backed by
        # coverlet.collector (registered as a PackageReference in each test
        # csproj). The data-collector model is more robust on .NET 10 than
        # coverlet.msbuild, which crashes the Publisher project run with
        # "Unable to read beyond the end of the stream" during result
        # serialization.
        #
        # `Category!=LongRunning` excludes the multi-minute telemetry
        # quality soak tests; they are run by soak.yml on a schedule.
        shell: pwsh
        run: |
          $blameTimeout = if (
            "${{ matrix.project.name }}" -eq "Publisher.Module" -and
            "${{ runner.os }}" -eq "Linux") { "30m" } else { "10m" }
          dotnet test "${{ matrix.project.path }}" --no-build -c Release `
            --blame-hang-timeout $blameTimeout --blame-hang-dump-type none `
            --filter "Category!=LongRunning" `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory ./testresults/${{ matrix.project.name }} `
            --settings coverage.runsettings `
            --collect:"XPlat Code Coverage;Format=cobertura"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testresults-${{ matrix.os }}-${{ matrix.project.name }}
          path: ./testresults
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # aot_publish: Native-AOT gate for the Publisher.Module. The ILC toolchain
  # restore requires the public nuget.org feed and cannot run in the offline
  # local dev environment, so this is validated here in CI. Publishes the
  # module self-contained with the Native-AOT toolchain (-p:IIoTPublishAot=true
  # sets PublishAot as a Module-local property and compiles the MCP tool server
  # out of the image, because its schema generation is reflective). Runs as its
  # own job in parallel with build_test so a trim/AOT regression is surfaced
  # without blocking the normal build & test matrix.
  # --------------------------------------------------------------------------
  aot_publish:
    name: AOT publish gate (Publisher.Module / linux-x64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        # Restore against nuget.org explicitly (the repo Nuget.Config points
        # only at the internal Azure Artifacts feed) and pass the RID + AOT
        # flag so the restore also pulls the Native-AOT ILC runtime packages
        # (Microsoft.DotNet.ILCompiler + runtime.linux-x64.*), letting the
        # subsequent publish run with --no-restore.
        run: |
          set -o pipefail
          mkdir -p artifacts/aot-inventory
          dotnet restore src/Azure.IIoT.OpcUa.Publisher.Module/src -r linux-x64 \
            -p:IIoTPublishAot=true -s https://api.nuget.org/v3/index.json \
            2>&1 | tee artifacts/aot-inventory/restore.log
        shell: bash
      - name: AOT publish (self-contained, Native-AOT)
        # Fails the job if the Native-AOT compiler (ILC) reports a hard
        # error. Trim/AOT analyzer warnings surface during the ordinary
        # build (the Module sets IIoTNativeAot=true); this step is the
        # end-to-end native compilation gate.
        run: |
          set -o pipefail
          dotnet publish src/Azure.IIoT.OpcUa.Publisher.Module/src \
            -c Release -r linux-x64 --self-contained --no-restore \
            -p:IIoTPublishAot=true 2>&1 | tee artifacts/aot-inventory/publish.log
        shell: bash
      - name: Generate AOT warning inventory
        if: always()
        run: |
          set -euo pipefail
          logs=()
          for log in artifacts/aot-inventory/restore.log artifacts/aot-inventory/publish.log; do
            if [ -f "$log" ]; then
              logs+=(--log "$log")
            fi
          done
          assets=()
          if [ -f src/Azure.IIoT.OpcUa.Publisher.Module/src/obj/project.assets.json ]; then
            assets+=(--assets src/Azure.IIoT.OpcUa.Publisher.Module/src/obj/project.assets.json)
          fi
          python3 tools/scripts/generate-aot-inventory.py \
            "${logs[@]}" "${assets[@]}" \
            --repo-root . --commit "$GITHUB_SHA" \
            --json-out artifacts/aot-inventory/report.json \
            --markdown-out artifacts/aot-inventory/report.md
        shell: bash
      - name: Materialize protected AOT baseline
        id: aot_policy_baseline
        if: success()
        run: |
          set -euo pipefail
          baseline_source=tools/aot/publisher-module-nativeaot-baseline.json
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${BASE_SHA}" ]; then
              echo "::error::Pull request base SHA is unavailable; refusing to use the PR baseline."
              exit 1
            fi
            if ! git cat-file -e "${BASE_SHA}:${baseline_source}" 2>/dev/null; then
              echo "::error::Protected AOT baseline is missing at base ${BASE_SHA}: ${baseline_source}"
              exit 1
            fi
            git show "${BASE_SHA}:${baseline_source}" > artifacts/aot-inventory/protected-baseline.json
            echo "path=artifacts/aot-inventory/protected-baseline.json" >> "$GITHUB_OUTPUT"
          else
            if [ ! -f "${baseline_source}" ]; then
              echo "::error::Checked-in AOT baseline is missing: ${baseline_source}"
              exit 1
            fi
            echo "path=${baseline_source}" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
      - name: Enforce AOT warning baseline
        if: success()
        run: |
          set -euo pipefail
          python3 tools/scripts/generate-aot-inventory.py \
            --log artifacts/aot-inventory/restore.log \
            --log artifacts/aot-inventory/publish.log \
            --assets src/Azure.IIoT.OpcUa.Publisher.Module/src/obj/project.assets.json \
            --repo-root . --commit "$GITHUB_SHA" \
            --baseline "${{ steps.aot_policy_baseline.outputs.path }}" \
            --candidate-baseline tools/aot/publisher-module-nativeaot-baseline.json \
            --enforce
        shell: bash
      - name: Upload AOT warning inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-warning-inventory
          path: artifacts/aot-inventory
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # aot_publish_arm64: cross-compilation gate for the linux-arm64 Native-AOT
  # image. The x64 gate above cannot catch host/target architecture problems
  # because there the host and target agree. Cross-compiling surfaces a whole
  # class of defects that are invisible otherwise - most notably a build-time
  # tool (source generator / analyzer) picking up the consuming project's
  # RuntimeIdentifier and being emitted for the target architecture, which the
  # compiler process then cannot load. That failure shows up as a CS8034
  # warning followed by hard CS0246 errors for every generated type.
  #
  # Native-AOT cannot cross-compile from Windows at all ("Cross-OS native
  # compilation is not supported"), so linux-arm64 is only reachable from a
  # Linux host with the aarch64 cross toolchain installed. Deliberately no
  # warning-baseline enforcement here: the trim/AOT inventory is architecture
  # independent and is already enforced by the linux-x64 job.
  # --------------------------------------------------------------------------
  aot_publish_arm64:
    name: AOT publish gate (Publisher.Module / linux-arm64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install aarch64 cross toolchain
        # ILC links through `clang --target=aarch64-linux-gnu -fuse-ld=bfd`, so
        # it needs the cross binutils, the cross gcc, and the arm64 libc
        # development files. libc6-dev-arm64-cross is the one that provides
        # Scrt1.o/crti.o and libdl/librt/libm; without it the link fails.
        # Do not pass -p:SysRoot: these packages install into the compiler's
        # default target search path, and the libc linker scripts use absolute
        # paths that a sysroot prefix would resolve twice.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
        shell: bash
      - name: Restore (linux-arm64)
        run: |
          set -o pipefail
          mkdir -p artifacts/aot-arm64
          dotnet restore src/Azure.IIoT.OpcUa.Publisher.Module/src -r linux-arm64 \
            -p:IIoTPublishAot=true -s https://api.nuget.org/v3/index.json \
            2>&1 | tee artifacts/aot-arm64/restore.log
        shell: bash
      - name: AOT publish (self-contained, Native-AOT, linux-arm64)
        run: |
          set -o pipefail
          dotnet publish src/Azure.IIoT.OpcUa.Publisher.Module/src \
            -c Release -r linux-arm64 --self-contained --no-restore \
            -p:IIoTPublishAot=true \
            -p:ObjCopyName=aarch64-linux-gnu-objcopy \
            2>&1 | tee artifacts/aot-arm64/publish.log
        shell: bash
      - name: Verify the produced binary is aarch64
        # A silent fallback to the host architecture would make this gate
        # pass while shipping an unusable image, so assert the ELF machine.
        run: |
          set -euo pipefail
          binary=$(find src/Azure.IIoT.OpcUa.Publisher.Module/src/bin -type f \
            -name 'Azure.IIoT.OpcUa.Publisher.Module' -path '*native*' | head -1)
          if [ -z "$binary" ]; then
            echo "::error::Native-AOT linux-arm64 binary was not produced."
            exit 1
          fi
          file "$binary"
          file "$binary" | grep -q 'ARM aarch64'
        shell: bash
      - name: Upload arm64 AOT logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-arm64-logs
          path: artifacts/aot-arm64
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # soak_smoke: run the telemetry quality soaks at a deliberately small size
  # so the heartbeat watchdog is actually exercised on every pull request.
  #
  # build_test excludes Category=LongRunning, so without this job the soaks
  # would compile but never execute here, and a regression in the watchdog
  # would only be caught by the nightly soak (or, as happened once, by the
  # internal build which cannot be filtered).
  #
  # 50 nodes x 1 minute is enough: with the pre-fix watchdog this
  # configuration reports ~900 early heartbeats per scenario, so the signal
  # is three orders of magnitude above the noise floor of zero. The full
  # 500-node / 30-minute runs stay in soak.yml.
  #
  # The assertions this job relies on are load independent -- it asserts that
  # no heartbeat fired *before* the watchdog deadline, which a busy runner
  # cannot cause -- so a shared GitHub runner is a valid host for it.
  # --------------------------------------------------------------------------
  soak_smoke:
    name: Telemetry quality smoke
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: src/Azure.IIoT.OpcUa.Publisher.Module/tests/Azure.IIoT.OpcUa.Publisher.Module.Tests.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore "$PROJECT" -s https://api.nuget.org/v3/index.json
        shell: bash
      - name: Build
        run: dotnet build "$PROJECT" -c Release --no-restore
        shell: bash
      - name: Soak (smoke)
        shell: bash
        env:
          IIOT_TELEMETRY_SOAK: '1'
          IIOT_TELEMETRY_SOAK_NODES: '50'
          IIOT_TELEMETRY_SOAK_MINUTES: '1'
        run: |
          dotnet test "$PROJECT" --no-build -c Release \
            --blame-hang-timeout 30m --blame-hang-dump-type none \
            --filter "Category=LongRunning" \
            --logger "trx;LogFileName=soak-smoke.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory ./testresults/soak-smoke
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testresults-soak-smoke
          path: ./testresults
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # coverage_report: merge all per-shard cobertura files into a single
  # report, render a markdown summary into $GITHUB_STEP_SUMMARY, and
  # upload the merged HTML report as an artifact.
  # --------------------------------------------------------------------------
  coverage_report:
    name: Coverage Report
    needs: build_test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./all-testresults
          pattern: testresults-*
      - name: Install ReportGenerator
        working-directory: ${{ runner.temp }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --add-source https://api.nuget.org/v3/index.json
        shell: bash
      - name: Merge coverage
        run: |
          set -euo pipefail
          shopt -s globstar
          reports=$(find ./all-testresults -name 'coverage*.cobertura.xml' | paste -sd ';' -)
          if [ -z "$reports" ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "_No coverage files were produced by the matrix jobs._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Merging: $reports"
          reportgenerator \
            "-reports:$reports" \
            "-targetdir:./coverage" \
            "-reporttypes:Cobertura;MarkdownSummary;Html" \
            "-title:Industrial-IoT Test Coverage" \
            "-assemblyfilters:+*;-*.Tests;-*tests"
          if [ -f ./coverage/Summary.md ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            cat ./coverage/Summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ./coverage
          if-no-files-found: warn
          retention-days: 14
      # Per-assembly floors, ratcheted. The floors live in
      # tools/scripts/coverage-thresholds.json and only ever move up: while an
      # assembly is being brought to the 85% line / 70% branch target its floor
      # sits at whatever was last measured, so the work cannot silently regress
      # while it is in progress. This runs against ReportGenerator's merged
      # Cobertura rather than the raw per-job files, because an assembly appears
      # in the report of every suite that touched it and the runs have to be
      # unioned rather than summed.
      - name: Check coverage floors
        run: pwsh ./tools/scripts/check-coverage.ps1 -ReportPath ./coverage/Cobertura.xml
        shell: bash

  # --------------------------------------------------------------------------
  # images_build: build a tarball per linux architecture using the existing
  # tools/scripts/build.ps1 in tar-only mode (no -ContainerRegistry, just
  # -TarFileOutput). Skipped on pull_request because pushing/signing images
  # requires repo secrets and packages:write -- which we never grant to
  # PRs from forks. The single-arch iot/opc-ua-test-server csproj is
  # auto-skipped by build.ps1 for arm/arm64 thanks to the
  # ContainerRuntimeIdentifier check added in this change.
  # --------------------------------------------------------------------------
  images_build:
    name: Build image tarballs (linux/${{ matrix.arch }})
    needs: [version, build_test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build container tarballs
        # No -ContainerRegistry; build.ps1 will only produce tar.gz files
        # under $TARBALL_OUT (one per container csproj that matches the
        # requested arch). -PackageSource pins restore to nuget.org so the
        # internal-only Nuget.Config does not break the runner.
        env:
          TARBALL_OUT: ${{ runner.temp }}/tarballs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:TARBALL_OUT -Force | Out-Null
          ./tools/scripts/build.ps1 `
            -Os linux `
            -Arch ${{ matrix.arch }} `
            -TarFileOutput $env:TARBALL_OUT `
            -PackageSource https://api.nuget.org/v3/index.json `
            -BranchName "${{ github.ref_name }}"
          Write-Host "Produced tarballs:"
          Get-ChildItem -Recurse -Filter '*.tar.gz' -Path $env:TARBALL_OUT |
            ForEach-Object { Write-Host "  $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # IMPORTANT: per-arch artifact name (not merged) because
          # build.ps1 strips the runtime ID from tar filenames, so tarballs
          # from different arches share the same basename and would
          # overwrite each other if downloaded into one directory.
          name: images-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # images_push: download all per-arch tarballs into arch-specific subdirs,
  # run dockerize.ps1 to produce one Dockerfile + build context per image
  # (with a `FROM scratch as linux_<arch>` target per arch), then
  # docker buildx build --push the multi-arch image to GHCR and cosign
  # sign the resulting manifest index digest with GitHub OIDC.
  # --------------------------------------------------------------------------
  images_push:
    name: Push multi-arch images to GHCR
    needs: [version, images_build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless signing via GH OIDC
    outputs:
      images: ${{ steps.dockerize.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all image tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # NOTE: do NOT set merge-multiple here -- artifacts must land in
          # arch-specific subdirectories so dockerize.ps1 can find both
          # arch variants of an image with the same basename.
          pattern: images-linux-*
          path: ${{ runner.temp }}/tarballs
      - name: Inventory downloaded tarballs
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find "${{ runner.temp }}/tarballs" -name '*.tar.gz' -printf '  %p (%s bytes)\n'
      - name: Prepare multi-arch Dockerfiles
        id: dockerize
        # Enhanced dockerize.ps1 writes <MatrixName>=<compactJson> to
        # $GITHUB_OUTPUT alongside the existing ##vso[...] output.
        shell: pwsh
        run: |
          ./tools/scripts/dockerize.ps1 `
            -TarFileInput "${{ runner.temp }}/tarballs" `
            -OutputFolder "${{ runner.temp }}/build-ctx" `
            -MatrixName images
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, push, and sign multi-arch images
        env:
          IMAGES_JSON: ${{ steps.dockerize.outputs.images }}
          REGISTRY: ghcr.io
          # The Azure org is the GHCR namespace owner; image repositories are
          # nested under it (e.g. ghcr.io/azure/iotedge/opc-publisher).
          NAMESPACE: azure
          SIMPLE_VERSION: ${{ needs.version.outputs.simple_version }}
          NUGET_VERSION: ${{ needs.version.outputs.nuget_version }}
          BUILD_CTX_ROOT: ${{ runner.temp }}/build-ctx
        shell: bash
        run: |
          set -euo pipefail

          # Iterate each entry in the matrix object emitted by dockerize.ps1.
          # Each entry contains: RepositoryName, BuildTag, BuildContextRel, Platforms.
          echo "$IMAGES_JSON" | python3 -c "
          import json, sys
          for name, entry in json.load(sys.stdin).items():
              print(f'{name}\t{entry[\"RepositoryName\"]}\t{entry[\"BuildContextRel\"]}\t{entry[\"Platforms\"]}')
          " | while IFS=$'\t' read -r name repo ctx platforms; do
              image="${REGISTRY}/${NAMESPACE}/${repo}"
              echo "::group::Building ${image}  platforms=${platforms}"

              # Tags:
              #   - :<simple_version>  always
              #   - :<nuget_version>   always (if differs from simple)
              #   - :latest            only when pushing from main. Deliberately
              #     not preview: a pre-release line must never claim the
              #     floating tag that unpinned consumers resolve to.
              tag_args=( -t "${image}:${SIMPLE_VERSION}" )
              if [ "${SIMPLE_VERSION}" != "${NUGET_VERSION}" ]; then
                # Docker tags cannot contain '+'; nbgv NBGV_NuGetPackageVersion
                # uses '-rc.N' style for prereleases (no '+'), so it is safe.
                tag_args+=( -t "${image}:${NUGET_VERSION}" )
              fi
              if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
                tag_args+=( -t "${image}:latest" )
              fi

              metadata_file="${RUNNER_TEMP}/metadata-${name}.json"
              docker buildx build \
                  --platform "${platforms}" \
                  --push \
                  --provenance=true --sbom=true \
                  --metadata-file "${metadata_file}" \
                  --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                  --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                  --label "org.opencontainers.image.version=${SIMPLE_VERSION}" \
                  --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  "${tag_args[@]}" \
                  "${BUILD_CTX_ROOT}/${ctx}"

              # cosign sign the multi-arch manifest index digest. Consumers
              # that 'docker pull' resolve to this digest, so signing the
              # index is the right level.
              digest=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['containerimage.digest'])" "${metadata_file}")
              echo "Signing ${image}@${digest}"
              cosign sign --yes "${image}@${digest}"

              # Add to the job summary for human readability.
              {
                echo "### ${image}"
                echo ""
                for t in "${tag_args[@]:1:99}"; do
                  if [ "${t}" != "-t" ]; then echo "- \`${t}\`"; fi
                done
                echo ""
                echo "- platforms: \`${platforms}\`"
                echo "- digest:    \`${digest}\`"
                echo "- signed:    cosign keyless (GH OIDC)"
              } >> "$GITHUB_STEP_SUMMARY"

              echo "::endgroup::"
          done

  # --------------------------------------------------------------------------
  # nuget_pack: build NuGet packages. common.props sets IsPackable=false as
  # the default; only three csproj override it (Models, Sdk, Testing.Servers).
  # We assert exactly that set is produced so any future drift fails loudly.
  # --------------------------------------------------------------------------
  nuget_pack:
    name: Pack NuGet packages
    needs: [version, build_test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution
        # Pin restore to nuget.org because the repo Nuget.Config only
        # configures the internal Azure Artifacts feed.
        shell: bash
        run: |
          dotnet restore Industrial-IoT.slnx \
            -s https://api.nuget.org/v3/index.json
      - name: Build solution
        # Pack does not build the projects when run against the solution
        # (the packable project outputs would be missing -> NU5026), so build
        # the Release outputs explicitly before packing with --no-build.
        shell: bash
        run: |
          dotnet build Industrial-IoT.slnx \
            -c Release \
            --no-restore \
            /p:ContinuousIntegrationBuild=true
      - name: Pack solution
        shell: bash
        run: |
          dotnet pack Industrial-IoT.slnx \
            -c Release \
            -o ./nupkgs \
            --no-restore \
            --no-build \
            /p:ContinuousIntegrationBuild=true
      - name: Validate produced packages
        shell: bash
        # The two projects that override common.props IsPackable=false:
        #   - Azure.IIoT.OpcUa.Publisher.Models
        #   - Azure.IIoT.OpcUa.Publisher.Sdk
        #
        # Azure.IIoT.OpcUa.Publisher.Testing.Servers was packable up to 2.9 and
        # is deliberately not packable in 3.0. It consumes the Quickstarts
        # servers through an `Aliases="Quickstarts"` extern alias, and an extern
        # alias is a compile time construct that does not travel with a package:
        # a consumer would resolve an unaliased transitive dependency and hit
        # exactly the type collisions the alias exists to prevent. It would also
        # make a sample package part of our public dependency graph.
        run: |
          set -euo pipefail
          expected=(
            'Azure.IIoT.OpcUa.Publisher.Models'
            'Azure.IIoT.OpcUa.Publisher.Sdk'
          )
          echo "Produced packages:"
          ls -la ./nupkgs
          for pkg in "${expected[@]}"; do
            if ! ls "./nupkgs/${pkg}."*.nupkg >/dev/null 2>&1; then
              echo "::error::Expected package ${pkg}.*.nupkg not produced"
              exit 1
            fi
            echo "  ok: ${pkg}"
          done
          actual=$(find ./nupkgs -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)
          if [ "${actual}" -ne "${#expected[@]}" ]; then
            echo "::warning::Expected ${#expected[@]} .nupkg file(s) but found ${actual}. The IsPackable set may have drifted."
          fi
      - name: Upload nupkgs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: ./nupkgs
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # nuget_publish: push to the Azure org NuGet feed on GitHub Packages.
  # Only runs on push to main, preview or release/* (not on PR, not on
  # dispatch, not on schedule). --skip-duplicate makes re-runs idempotent
  # across reruns and against the existing internal pipeline (which may have
  # already published the same version).
  # --------------------------------------------------------------------------
  nuget_publish:
    name: Push packages to GitHub Packages
    needs: nuget_pack
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkgs
          path: ./nupkgs
      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push './nupkgs/*.nupkg' \
            --source 'https://nuget.pkg.github.com/Azure/index.json' \
            --api-key "${GITHUB_TOKEN}" \
            --skip-duplicate

  # --------------------------------------------------------------------------
  # e2e: invoke the reusable E2E standalone workflow with the image tag we
  # just pushed. Gated to push (main/preview/release/*), manual dispatch
  # (opt-in via run_e2e input), and the nightly schedule -- never PRs.
  # --------------------------------------------------------------------------
  e2e:
    name: E2E standalone tests
    needs: [version, images_push]
    # Reusable workflows inherit at most the caller's permissions. Without
    # this block the e2e job's GITHUB_TOKEN would not have id-token: write
    # and azure/login@v2 OIDC federation would fail.
    permissions:
      id-token: write
      contents: read
      actions: read
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/release/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    uses: ./.github/workflows/e2e-standalone.yml
    with:
      # The NuGet version, not the simple version. images_push tags every image
      # with both, but the simple version is just major.minor.patch and is
      # therefore reused by every prerelease build of the same version: on
      # preview it is 3.0.0 for all of them. A second push landing while this
      # run deploys would move that tag, and E2E would silently validate a
      # different build than the one that triggered it. The NuGet version
      # carries the prerelease height (3.0.0-rc-0007), so it identifies this
      # commit's image. When the two are equal images_push pushes the single
      # tag, and this still resolves.
      image_tag: ${{ needs.version.outputs.nuget_version }}
      image_registry: ghcr.io
      image_namespace: azure
      region: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_region || 'northeurope' }}
      resource_group_name: '<generated>'
      cleanup: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_cleanup }}
      head_sha: ${{ github.sha }}
    secrets: inherit
