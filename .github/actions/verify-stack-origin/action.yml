name: Verify stack origin
description: >
  Fails when the vendored OPC UA stack submodule is not pinned to the OPC
  Foundation repository. Used to gate every job that publishes an artifact.

runs:
  using: composite
  steps:
    - name: Refuse to publish artifacts built from a forked stack
      # The OPC UA stack is the security-critical part of the product, so a
      # published artifact must be built from the OPC Foundation repository and
      # not from anyone's fork. The pin is allowed to point at a fork on
      # branches, so that work can continue against an unmerged upstream pull
      # request, but it must never reach anything published: a personal fork
      # can be deleted, made private or force-pushed, which would make the
      # build unreproducible after the fact.
      shell: bash
      run: |
        set -uo pipefail
        url=$(git config -f .gitmodules submodule.external/UA-.NETStandard.url || true)
        echo "submodule url: '${url}'"
        # Compare the whole url against the accepted forms. A substring match
        # would also accept github.com/evil-OPCFoundation/UA-.NETStandard and
        # evil.example/OPCFoundation/UA-.NETStandard.
        case "${url%.git}" in
          https://github.com/OPCFoundation/UA-.NETStandard|git@github.com:OPCFoundation/UA-.NETStandard|ssh://git@github.com/OPCFoundation/UA-.NETStandard)
            echo "Stack is vendored from OPCFoundation." ;;
          "")
            echo "::error::Refusing to publish: could not read the external/UA-.NETStandard url from .gitmodules."
            exit 1 ;;
          *)
            echo "::error::Refusing to publish: external/UA-.NETStandard is vendored from '${url}' rather than OPCFoundation/UA-.NETStandard. Revert .gitmodules (and repin to upstream master) before publishing."
            exit 1 ;;
        esac
